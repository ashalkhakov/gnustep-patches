name: Stack

# The patched GNUstep stack, the one every application builds and tests on,
# built here once and published as an archive. Every push builds it on Ubuntu
# 22.04 (the oldest LTS in support, so that what is built on it runs on
# anything newer) for x86_64 and aarch64, checks it (verified, and a
# Foundation program built on it and run), and uploads
#
#   gnustep-patches-<version>-ubuntu22.04-<arch>.tar.xz      (opt/gnustep)
#
# and on Windows, in MSYS2's CLANG64 environment, the same components and
# patches by the same script into C:\GNUstep:
#
#   gnustep-patches-<version>-windows-clang64-x86_64.tar.xz  (GNUstep)
#
# as the run's artifact; a v* tag (the date: v2026.10.13, or v2026.10.13.1 for
# a second the same day) also attaches it to the tag's release, where an
# application's GNUSTEP_PATCHES_VERSION (its .github/pins.env) finds it.
on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: write

jobs:
  stack:
    name: Stack (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, ubuntu-22.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    env:
      PREFIX: /opt/gnustep
      CC: clang
      CXX: clang++
      LIBRARY_COMBO: ng-gnu-gnu
      RUNTIME_VERSION: gnustep-2.0
      LD_LIBRARY_PATH: /opt/gnustep/lib
      COMPONENTS: libobjc2 libdispatch tools-make libs-base libs-gui libs-back libs-corebase libs-opal eau tools-xctest
    steps:
      - uses: actions/checkout@v4

      - name: Names
        run: |
          version="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = tag ] || version="0.0.0-$(git rev-parse --short HEAD)"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "ARCHIVE=gnustep-patches-$version-ubuntu22.04-$(uname -m).tar.xz" >> "$GITHUB_ENV"

      # From Ubuntu's archive only: the runner carries Google Chrome's and
      # Microsoft's apt sources, which nothing here installs from, and an
      # update straddling Google's republishing fails on a hash mismatch.
      - name: Packages
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome* /etc/apt/sources.list.d/*google* \
                     /etc/apt/sources.list.d/microsoft* || true
          packages=$(grep -v '^#' Scripts/packages-ubuntu.txt | tr '\n' ' ')
          for i in 1 2 3; do
            sudo apt-get -q -o Acquire::Retries=3 update \
              && sudo apt-get -q -y -o Acquire::Retries=3 install $packages && break
            [ "$i" != 3 ] || exit 1
            sleep 10
          done
          # The gnustep-2.0 runtime needs ld.gold or lld; 22.04's binutils has gold.
          sudo update-alternatives --install /usr/bin/ld ld /usr/bin/ld.gold 10
          # libdispatch wants CMake 3.26 or newer; 22.04's is 3.22.
          python3 -m pip install --user --quiet 'cmake>=3.26'
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build
        run: |
          sudo mkdir -p "$PREFIX" && sudo chown "$(id -u):$(id -g)" "$PREFIX"
          SOURCES="$RUNNER_TEMP/gnustep-sources" Scripts/build-gnustep.sh

      # What it is, beside it: the version, the commit of every component, the
      # package list building on it needs, and the script that checks it.
      - name: Manifest
        run: |
          d=$PREFIX/share/gnustep-patches
          mkdir -p "$d"
          echo "$VERSION" > "$d/VERSION"
          { echo "gnustep-patches $GITHUB_SHA"
            for s in "$RUNNER_TEMP"/gnustep-sources/*/; do echo "$(basename "$s") $(git -C "$s" rev-parse HEAD)"; done
          } > "$d/MANIFEST"
          cp Scripts/packages-ubuntu.txt Scripts/build-gnustep.sh "$d/"
          cat "$d/MANIFEST"

      # Checked as it is shipped: libdispatch's main-queue hooks in
      # gnustep-base, ICU, the backend bundle; and a Foundation program built
      # with gnustep-make's own rules, as an application's GNUmakefile does.
      - name: Check
        run: |
          Scripts/build-gnustep.sh --verify-only
          . "$PREFIX/System/Library/Makefiles/GNUstep.sh"
          mkdir -p "$RUNNER_TEMP/hello" && cd "$RUNNER_TEMP/hello"
          printf '%s\n' '#import <Foundation/Foundation.h>' \
            'int main(void) { @autoreleasepool { NSLog(@"%u %lu", 7U, 8UL); printf("%s\n", [[NSString stringWithFormat: @"hello %u %lu %o", 7U, 8UL, 8U] UTF8String]); } return 0; }' > hello.m
          printf '%s\n' 'include $(GNUSTEP_MAKEFILES)/common.make' 'TOOL_NAME = hello' 'hello_OBJC_FILES = hello.m' \
            'include $(GNUSTEP_MAKEFILES)/tool.make' > GNUmakefile
          make -s
          [ "$(./obj/hello)" = "hello 7 8 10" ]

      - name: Archive
        run: |
          tar -C / -cJf "$RUNNER_TEMP/$ARCHIVE" opt/gnustep
          ls -la "$RUNNER_TEMP/$ARCHIVE"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE }}
          path: ${{ runner.temp }}/${{ env.ARCHIVE }}
          if-no-files-found: error
          retention-days: ${{ github.ref_type == 'tag' && 90 || 14 }}

      - name: Attach to the release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ runner.temp }}/${{ env.ARCHIVE }}

  windows:
    name: Stack (windows-2025, CLANG64)
    runs-on: windows-2025
    timeout-minutes: 240
    defaults:
      run:
        shell: msys2 {0}
    env:
      PREFIX: /c/GNUstep
      CC: clang
      CXX: clang++
      LIBRARY_COMBO: ng-gnu-gnu
      RUNTIME_VERSION: gnustep-2.0
      # Eau is built on X11; Windows applications use WinUXTheme, the native
      # look, instead.
      COMPONENTS: libobjc2 libdispatch tools-make libs-base libs-gui libs-back libs-corebase libs-opal winuxtheme tools-xctest
    steps:
      # The patches are applied byte for byte: no CRLF.
      - name: Line endings
        shell: pwsh
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true

      - name: Packages
        run: |
          packages=$(grep -v '^#' Scripts/packages-msys2.txt | sed "/\//!s/^/$MINGW_PACKAGE_PREFIX-/" | tr '\n' ' ')
          # A mirror that stalls fails the download; pacman tries another
          # next time.
          for i in 1 2 3; do
            pacman -S --noconfirm --needed $packages && break
            [ "$i" != 3 ] || exit 1
            sleep 10
          done

      - name: Names
        run: |
          version="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = tag ] || version="0.0.0-$(git rev-parse --short HEAD)"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "ARCHIVE=gnustep-patches-$version-windows-clang64-x86_64.tar.xz" >> "$GITHUB_ENV"

      - name: Build
        run: SOURCES="$(cygpath -u "$RUNNER_TEMP")/gnustep-sources" Scripts/build-gnustep.sh

      - name: Manifest
        run: |
          d=$PREFIX/share/gnustep-patches
          mkdir -p "$d"
          echo "$VERSION" > "$d/VERSION"
          { echo "gnustep-patches $GITHUB_SHA"
            for s in "$(cygpath -u "$RUNNER_TEMP")"/gnustep-sources/*/; do echo "$(basename "$s") $(git -C "$s" rev-parse HEAD)"; done
          } > "$d/MANIFEST"
          cp Scripts/packages-msys2.txt Scripts/build-gnustep.sh "$d/"
          cat "$d/MANIFEST"

      - name: Check
        run: |
          Scripts/build-gnustep.sh --verify-only
          . "$PREFIX/System/Library/Makefiles/GNUstep.sh"
          export PATH="$PREFIX/bin:$PATH"
          mkdir -p "$(cygpath -u "$RUNNER_TEMP")/hello" && cd "$(cygpath -u "$RUNNER_TEMP")/hello"
          printf '%s\n' '#import <Foundation/Foundation.h>' \
            'int main(void) { @autoreleasepool { NSLog(@"%u %lu", 7U, 8UL); printf("%s\n", [[NSString stringWithFormat: @"hello %u %lu %o", 7U, 8UL, 8U] UTF8String]); } return 0; }' > hello.m
          printf '%s\n' 'include $(GNUSTEP_MAKEFILES)/common.make' 'TOOL_NAME = hello' 'hello_OBJC_FILES = hello.m' \
            'include $(GNUSTEP_MAKEFILES)/tool.make' > GNUmakefile
          make -s
          [ "$(./obj/hello 2>stderr.txt | tr -d '\r')" = "hello 7 8 10" ]
          # base reads its GNUstep.conf from beside its DLL, all Windows paths.
          cat stderr.txt
          ! grep -q "is not an absolute path" stderr.txt

      - name: Archive
        run: |
          tar -C /c -cJf "$(cygpath -u "$RUNNER_TEMP")/$ARCHIVE" GNUstep
          ls -la "$(cygpath -u "$RUNNER_TEMP")/$ARCHIVE"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE }}
          path: ${{ runner.temp }}/${{ env.ARCHIVE }}
          if-no-files-found: error
          retention-days: ${{ github.ref_type == 'tag' && 90 || 14 }}

      - name: Attach to the release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ runner.temp }}/${{ env.ARCHIVE }}
