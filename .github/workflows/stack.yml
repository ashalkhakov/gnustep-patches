name: Stack

# The patched GNUstep stack as an image (Docker/stack.Dockerfile), the one
# every app builds and tests on. Every push and pull request builds it for
# both architectures and checks it: the stack verified, and a Foundation
# program built against it and run. A v* tag (the date: v2026.10.13, or
# v2026.10.13.1 for a second the same day) also publishes it as
#
#   ghcr.io/<owner>/gnustep:<version> and :latest
#
# Each architecture is built on a runner of its own (ubuntu-22.04 and
# ubuntu-22.04-arm), not under QEMU, which would take hours over the stack;
# the two are then joined into one tag.
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/gnustep

jobs:
  image:
    name: Image (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-22.04
          - platform: linux/arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Names
        id: names
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          echo "arch=${PLATFORM#linux/}" >> "$GITHUB_OUTPUT"
          version="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = tag ] || version="0.0.0-$(git rev-parse --short HEAD)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Docker/stack.Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            VERSION=${{ steps.names.outputs.version }}
            REVISION=${{ github.sha }}
          load: true
          tags: gnustep:check
          cache-from: type=gha,scope=stack-${{ steps.names.outputs.arch }}
          cache-to: type=gha,scope=stack-${{ steps.names.outputs.arch }},mode=max

      # What it is, and that a program builds on it and runs: Foundation from
      # gnustep-make's own rules, the way an app's GNUmakefile uses it.
      - name: Check
        run: |
          docker image ls gnustep:check
          docker run --rm gnustep:check bash -c 'cat /opt/gnustep/share/gnustep-patches/VERSION /opt/gnustep/share/gnustep-patches/MANIFEST'
          docker run --rm gnustep:check bash -c '
            set -e
            . /opt/gnustep/System/Library/Makefiles/GNUstep.sh
            mkdir /tmp/hello && cd /tmp/hello
            printf "%s\n" "#import <Foundation/Foundation.h>" \
              "int main(void) { @autoreleasepool { NSLog(@\"%@\", [[NSProcessInfo processInfo] operatingSystemVersionString]); printf(\"hello\\n\"); } return 0; }" > hello.m
            printf "%s\n" "include \$(GNUSTEP_MAKEFILES)/common.make" "TOOL_NAME = hello" "hello_OBJC_FILES = hello.m" \
              "include \$(GNUSTEP_MAKEFILES)/tool.make" > GNUmakefile
            make -s
            [ "$(./obj/hello)" = hello ]'

      - name: Log in to the registry
        if: github.ref_type == 'tag'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pushed by digest only; the join below tags the two as one.
      - name: Push
        id: push
        if: github.ref_type == 'tag'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Docker/stack.Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            VERSION=${{ steps.names.outputs.version }}
            REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.names.outputs.version }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=stack-${{ steps.names.outputs.arch }}

      - name: Keep the digest
        if: github.ref_type == 'tag'
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest="${{ steps.push.outputs.digest }}"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        if: github.ref_type == 'tag'
        with:
          name: digest-${{ steps.names.outputs.arch }}
          path: ${{ runner.temp }}/digests/*
          retention-days: 1

  publish:
    name: Publish
    if: github.ref_type == 'tag'
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag both architectures as one
        working-directory: ${{ runner.temp }}/digests
        run: |
          version="${GITHUB_REF_NAME#v}"
          sources=()
          for digest in *; do sources+=("$IMAGE@sha256:$digest"); done
          docker buildx imagetools create -t "$IMAGE:$version" -t "$IMAGE:latest" "${sources[@]}"
          docker buildx imagetools inspect "$IMAGE:$version"
